<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Your Decor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container">
    <div class="auth-box">
      <h1>Welcome Back</h1>
      <div id="alert" class="alert"></div>
      <form id="loginForm">
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <button class="btn btn-block" type="submit">Login</button>
      </form>
      <p class="switch">Don't have an account? <a href="/register.html" id="switchLink">Register</a></p>
    </div>
  </div>

  <div id="footer"></div>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
