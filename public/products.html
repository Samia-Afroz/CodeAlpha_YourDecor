<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Your Decor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="page-header">
    <h1 id="pageTitle">All Products</h1>
    <div class="breadcrumb"><a href="/index.html">Home</a> / <span id="crumb">Shop</span></div>
  </div>

  <section class="section">
    <div class="container shop-layout">
      <aside class="sidebar">
        <h3>Categories</h3>
        <ul id="sideCats"></ul>
      </aside>

      <div>
        <div class="shop-toolbar">
          <span id="resultCount"></span>
          <select id="sortSelect">
            <option value="">Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
        <div class="product-grid" id="productGrid"><p>Loading...</p></div>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="/js/main.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
